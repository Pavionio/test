services:
  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./.qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - qdrant
    gpus: all
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./:/workspace
      - type: bind
        source: ${AVITO_DATASET_ZIP:?Set AVITO_DATASET_ZIP to the absolute path of dataset.zip}
        target: /input/dataset.zip
        read_only: true
    command: ["python", "-m", "src.run_submission"]

